server.port=8081
spring.application.name=shri-hari-collection

# Datasource - use environment variables; fallback to in-memory H2 for local development
spring.datasource.url=${DB_URL:jdbc:h2:mem:shri_hari_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
frontend.url=http://localhost:5173

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT settings (override via env or external config in production)
jwt.secret=${JWT_SECRET:change_me_securely_and_set_env}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

order.shipping-charge=${ORDER_SHIPPING_CHARGE:50}
order.free-shipping-threshold=${ORDER_FREE_SHIPPING_THRESHOLD:999}
